name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Unit tests with coverage
        run: pytest

      # 模型快速门禁:子样本训练 + AUC 断言(US-4)
      - name: Model quick gate
        run: python scripts/train.py --quick --assert-auc 0.60

      - name: Build image
        run: docker build -t banksys_kyai5:ci .
