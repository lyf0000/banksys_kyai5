name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Unit tests with coverage
        run: pytest

      # 模型快速门禁(train.py --quick --assert-auc 0.60)随 US-4 训练模块接入
      - name: Build image
        run: docker build -t banksys_kyai5:ci .
